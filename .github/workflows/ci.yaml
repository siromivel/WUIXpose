name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel an in-progress run when a newer commit lands on the same branch or PR.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Checks run as the same mise tasks as locally (mise.toml); `mise run check` runs them all. They're
# split over two jobs here so the backend and frontend run in parallel.
jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    env:
      # Settings refuse to load without a key when DEBUG is off, which it is here.
      DJANGO_SECRET_KEY: ci-only-not-secret
      # Use the Python that mise installs from mise.toml; fail rather than let uv download another.
      UV_PYTHON_DOWNLOADS: never

    steps:
      - uses: actions/checkout@v5

      # GeoDjango loads the GDAL and GEOS C libraries even just to import, and the
      # runner image doesn't include them.
      - name: Install GDAL and GEOS
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends gdal-bin

      - uses: jdx/mise-action@v5

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      # Builds the venv on mise's Python (matching .python-version) and fails if uv.lock is out of date.
      - name: Install dependencies
        run: uv sync --locked

      # The environments pre-commit builds for the hook repos in .pre-commit-config.yaml. They're
      # virtualenvs on mise's Python, so a Python bump in mise.toml has to rebuild them.
      - uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml', 'mise.toml') }}

      - name: File hygiene and config checks
        run: mise run hooks

      - name: Lint
        run: mise run lint

      - name: Type check
        run: mise run typecheck

      # This and the tests start Postgres/PostGIS and Redis from compose.yaml, as they do locally.
      - name: Check for missing migrations
        run: mise run migrations-check

      - name: Test
        run: mise run test

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5

      - uses: jdx/mise-action@v5

      # mise doesn't cache npm's download cache the way setup-node did.
      - uses: actions/cache@v6
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint, type-check and bundle
        run: mise run frontend-check

      - name: Test
        run: mise run frontend-test
