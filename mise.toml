[tools]
node = "24"
python = "3.15.0"

# Mirrors the README's local dev steps and CI's checks.
# Run `mise tasks` to list them.

[tasks.setup]
description = "Install Python and frontend dependencies, and the git hooks"
run = [
  "uv sync",
  "npm --prefix frontend ci",
  "uv run pre-commit install",  # hook types from .pre-commit-config.yaml
  "git config blame.ignoreRevsFile .git-blame-ignore-revs",
]

[tasks.db]
description = "Start Postgres/PostGIS and Redis"
# --wait returns once the healthchecks pass, so tasks that depend on this can connect right away.
run = "docker compose up -d --wait"

[tasks.migrate]
description = "Apply database migrations"
dir = "{{config_root}}/src/wuixpose"
depends = ["db"]
run = "uv run python manage.py migrate"

[tasks.dev]
description = "Run the Django dev server on :8000"
dir = "{{config_root}}/src/wuixpose"
depends = ["db"]
run = "uv run python manage.py runserver"

[tasks.dev-frontend]
description = "Run the map UI on :5173 (proxies /api and /tiles to :8000)"
dir = "{{config_root}}/frontend"
run = "npm run dev"

[tasks.lint]
description = "Lint Python and check its formatting"
run = [
  "uv run ruff check",
  "uv run ruff format --check",
]

[tasks.format]
description = "Apply Python's safe lint fixes, and format Python and the frontend"
run = [
  # Fixes what it safely can and leaves reporting the rest to lint, so this stays the one task
  # that changes files and lint stays a check, in CI and locally alike. Fix before formatting,
  # since a fix can leave code the formatter would change.
  "uv run ruff check --fix-only",
  "uv run ruff format",
  "npm --prefix frontend run format",
]

[tasks.format-file]
description = "Format one Python or frontend file (Claude Code's hook runs this after each edit)"
usage = 'arg "<file>"'
# Formats only, without format's lint fixes: an import added an edit before the code that uses it
# would otherwise be removed as unused.
run = '''
case "$usage_file" in
  "{{config_root}}"/frontend/*) npm --prefix frontend run --silent format -- --no-error-on-unmatched-pattern "$usage_file" ;;
  *.py|*.pyi) uv run --quiet ruff format --force-exclude "$usage_file" ;;
esac
'''

[tasks.typecheck]
description = "Type-check Python"
run = "uv run pyright"

[tasks.migrations-check]
description = "Fail if models and migrations are out of sync"
dir = "{{config_root}}/src/wuixpose"
# Not strictly needed, but without a database makemigrations warns that it can't check the
# applied migration history.
depends = ["db"]
run = "uv run python manage.py makemigrations --check --dry-run"

[tasks.test]
description = "Run the Python tests"
depends = ["db"]
run = "uv run pytest"

[tasks.frontend-check]
description = "Lint, format-check, type-check and bundle the frontend"
dir = "{{config_root}}/frontend"
run = [
  "npm run lint",
  "npm run format:check",
  "npm run build",  # tsc -b, then vite build
]

[tasks.frontend-test]
description = "Run the frontend tests"
dir = "{{config_root}}/frontend"
run = "npm test"

[tasks.hooks]
description = "Check file hygiene and config files (the git hooks the other checks don't cover)"
# The skipped hooks are the tasks CI runs on their own (formatting it checks with lint and
# frontend-check), and no-commit-to-branch is about where you commit, not what's in the files.
env = { SKIP = "no-commit-to-branch,format,lint,typecheck,frontend-check" }
run = "uv run pre-commit run --all-files --show-diff-on-failure"

[tasks.check]
description = "Everything CI runs"
depends = [
  "hooks", "lint", "typecheck", "migrations-check", "test", "frontend-check", "frontend-test",
]
