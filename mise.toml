[tools]
node = "24"
python = "3.15.0"

# Mirrors the README's local dev steps and CI's checks.
# Run `mise tasks` to list them.

[tasks.setup]
description = "Install Python and frontend dependencies"
run = [
  "uv sync",
  "npm --prefix frontend ci",
]

[tasks.db]
description = "Start Postgres/PostGIS and Redis"
# --wait returns once the healthchecks pass, so tasks that depend on this can connect right away.
run = "docker compose up -d --wait"

[tasks.migrate]
description = "Apply database migrations"
dir = "{{config_root}}/src/wuixpose"
depends = ["db"]
run = "uv run python manage.py migrate"

[tasks.dev]
description = "Run the Django dev server on :8000"
dir = "{{config_root}}/src/wuixpose"
depends = ["db"]
run = "uv run python manage.py runserver"

[tasks.dev-frontend]
description = "Run the map UI on :5173 (proxies /api and /tiles to :8000)"
dir = "{{config_root}}/frontend"
run = "npm run dev"

[tasks.lint]
description = "Lint Python"
run = "uv run ruff check"

[tasks.typecheck]
description = "Type-check Python"
run = "uv run pyright"

[tasks.migrations-check]
description = "Fail if models and migrations are out of sync"
dir = "{{config_root}}/src/wuixpose"
# Not strictly needed, but without a database makemigrations warns that it can't check the
# applied migration history.
depends = ["db"]
run = "uv run python manage.py makemigrations --check --dry-run"

[tasks.test]
description = "Run the Python tests"
depends = ["db"]
run = "uv run pytest"

[tasks.frontend-check]
description = "Lint, type-check and bundle the frontend"
dir = "{{config_root}}/frontend"
run = [
  "npm run lint",
  "npm run build",  # tsc -b, then vite build
]

[tasks.check]
description = "Everything CI runs"
depends = ["lint", "typecheck", "migrations-check", "test", "frontend-check"]
